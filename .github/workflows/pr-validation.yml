name: PR Validation

# This repository is Helm, not Terraform: everything in argocd/ is rendered by
# Argo CD's root Application on the hub. A template error would otherwise only
# surface as a failed sync after the merge, so the chart is rendered here — and
# the property the whole design rests on, that nothing reaches production
# without somebody promoting it, is asserted against the rendered output rather
# than trusted to a reviewer noticing.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chart:
    name: helm (lint + render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      # Rendered twice, because the second render produces an object the first
      # one does not: without a database in the Azure foundation's outputs the
      # db-hello ApplicationSet is deliberately absent, so only the SQL run
      # exercises that template.
      - name: Argo CD and Kargo configuration
        run: |
          helm lint argocd
          helm template platform-gitops argocd > /dev/null
          helm template platform-gitops argocd \
            --set sql.server=sql-onek8s-prototype-ab12.database.windows.net \
            --set sql.database=appdb > /dev/null

      # An ApplicationSet generator must not contain a Go template, and this is
      # the cheapest place to say so.
      #
      # A matrix generator renders each of its generators with the parameters of
      # the ones before it *before* running it, so a "{{ .name }}" inside the
      # cluster generator — the usual way to carry a cluster's name through a
      # "values" block — is resolved against the git generator's parameters
      # instead of against the cluster. With goTemplateOptions: [missingkey=error]
      # that fails the whole ApplicationSet, and the stage then has no
      # Application at all: a silent failure at the Argo CD end that surfaces at
      # the far end of the release path as Kargo reporting it cannot find the
      # Application it was told to sync.
      #
      # Anything a generator would have carried belongs in the Application
      # template, where both halves' parameters are in scope. The template is
      # where the braces are expected, so only generators are checked.
      - name: No generator carries a template
        run: |
          helm template platform-gitops argocd \
            --set sql.server=sql-onek8s-prototype-ab12.database.windows.net \
            --set sql.database=appdb > /tmp/generators.yaml
          python3 - <<'PY'
          import json, sys, yaml

          status = 0
          for doc in yaml.safe_load_all(open("/tmp/generators.yaml")):
              if not doc or doc["kind"] != "ApplicationSet":
                  continue
              rendered = json.dumps(doc["spec"]["generators"])
              if "{{" in rendered:
                  print(f"::error file=argocd/templates/_helpers.tpl::ApplicationSet "
                        f"{doc['metadata']['name']} has a Go template inside a generator: "
                        f"{rendered}. In a matrix it is rendered with the other "
                        "generator's parameters and fails under missingkey=error, "
                        "leaving the stage with no Application. Move it into the "
                        "Application template.")
                  status = 1
          sys.exit(status)
          PY

      # Which side of the argocd-agent boundary each object lands on. Getting
      # it wrong is silent in both directions and neither shows up in a render:
      #
      #   a spoke Application WITHOUT the label   the principal never sees it,
      #                                           so nothing routes it to the
      #                                           agent and the hub tries to
      #                                           apply it to what is actually
      #                                           the principal's resource proxy
      #   a hub Application WITH the label        the principal routes it to an
      #                                           agent that does not exist,
      #                                           while the hub's controller
      #                                           also reconciles it
      #   an unlabelled AppProject                distributed to no agent, so
      #                                           every Application on every
      #                                           spoke names a project its
      #                                           cluster has never heard of
      #
      # The rule is not a per-stage setting and must not become one: a stage
      # that names a fixed cluster is the hub, a stage that names only a cloud
      # is a spoke, and every spoke is an agent.
      - name: The agent label follows the topology
        run: |
          helm template platform-gitops argocd --set agent.enabled=true \
            --set sql.server=sql-onek8s-prototype-ab12.database.windows.net \
            --set sql.database=appdb > /tmp/agent-on.yaml
          helm template platform-gitops argocd \
            --set sql.server=sql-onek8s-prototype-ab12.database.windows.net \
            --set sql.database=appdb > /tmp/agent-off.yaml
          python3 - <<'PY'
          import sys, yaml

          values = yaml.safe_load(open("argocd/values.yaml"))
          label = values["agent"]["label"]
          status = 0

          def error(where, message):
              global status
              print(f"::error file={where}::{message}")
              status = 1

          # Which stages are on a spoke, straight out of values.yaml.
          spoke_stages = {
              f"{app}-{stage}"
              for app, cfg in values["apps"].items() if cfg.get("enabled")
              for stage, s in cfg["stages"].items() if not s.get("cluster")
          }
          if not spoke_stages:
              error("argocd/values.yaml", "No stage deploys to a spoke any more, so the "
                                          "agent path is not exercised at all.")

          on = [d for d in yaml.safe_load_all(open("/tmp/agent-on.yaml")) if d]
          off = [d for d in yaml.safe_load_all(open("/tmp/agent-off.yaml")) if d]

          for doc in on:
              if doc["kind"] != "ApplicationSet":
                  continue
              name = doc["metadata"]["name"]
              template = doc["spec"]["template"]
              labelled = template["metadata"].get("labels", {}).get(label) == "true"
              if name in spoke_stages and not labelled:
                  error("argocd/templates/applicationsets.yaml",
                        f"{name} deploys to a spoke but its Applications carry no {label!r}. "
                        "The principal only routes labelled Applications, so this stage "
                        "would never reach its agent.")
              if name not in spoke_stages and labelled:
                  error("argocd/templates/applicationsets.yaml",
                        f"{name} deploys to the hub but its Applications carry {label!r}. "
                        "The hub is the principal, not an agent: labelling it means the "
                        "principal routes it nowhere while the hub reconciles it anyway.")
              # The routing key itself.
              if "name" not in template["spec"]["destination"]:
                  error("argocd/templates/applicationsets.yaml",
                        f"{name} addresses its cluster by server URL. Destination-based "
                        "mapping routes on spec.destination.name; without it the principal "
                        "cannot tell which agent the Application belongs to.")

          project = next(d for d in on if d["kind"] == "AppProject")
          if project["metadata"].get("labels", {}).get(label) != "true":
              error("argocd/templates/project.yaml",
                    f"the AppProject carries no {label!r}, so the principal never "
                    "distributes it. Every Application on every spoke would name a project "
                    "its own Argo CD has never heard of.")
          if not any(d.get("name") == "*" for d in project["spec"]["destinations"]):
              error("argocd/templates/project.yaml",
                    "the AppProject has no 'name: \"*\"' destination. The principal matches "
                    "agent names against these entries to decide who gets the project.")

          # And a hub with no principal (OneK8s' enable_argocd_agent = false) must
          # label nothing at all, rather than labelling for agents that do not exist.
          for doc in off:
              labels = doc["metadata"].get("labels", {}) or {}
              nested = (doc.get("spec", {}).get("template", {}) or {}).get("metadata", {}).get("labels", {}) or {}
              if label in labels or label in nested:
                  error("argocd/values.yaml",
                        f"{doc['kind']} {doc['metadata']['name']} is labelled {label!r} with "
                        "agent.enabled=false. A hub without a principal has no agents.")

          sys.exit(status)
          PY

      # A hub without Kargo is a supported state (OneK8s' enable_kargo = false),
      # and it must render Argo CD objects and no promotion objects rather than
      # failing.
      - name: The same, with Kargo switched off
        run: |
          helm template platform-gitops argocd --set kargo.enabled=false \
            | grep -q 'kind: ApplicationSet'
          if helm template platform-gitops argocd --set kargo.enabled=false \
            | grep -q 'kargo.akuity.io/v1alpha1'; then
            echo "::error file=argocd/values.yaml::kargo.enabled=false still rendered Kargo objects."
            exit 1
          fi

  gate:
    name: the production gate holds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      # The promise this repository makes is that nothing reaches the AWS
      # production cluster without a person promoting it. With Kargo in front of
      # Argo CD that promise is three separate objects agreeing, none of which
      # is obviously load-bearing on its own:
      #
      #   the ProjectConfig  must not auto-promote the production Stage
      #   the Stage          must draw its Freight from staging, not from the
      #                      Warehouse, so an unproven build cannot be promoted
      #                      even by somebody allowed to promote
      #   the ApplicationSet must authorize its own Stage and no other
      #
      # Any one of them could be "made consistent" by a well-meaning edit. All
      # three are compared here against apps.hello.stages in values.yaml, which
      # is the file that is meant to be edited.
      - name: Every stage promotes the way values.yaml says it does
        run: |
          helm template platform-gitops argocd \
            --set sql.server=sql-onek8s-prototype-ab12.database.windows.net \
            --set sql.database=appdb > /tmp/rendered.yaml
          python3 - <<'PY'
          import sys, yaml

          values = yaml.safe_load(open("argocd/values.yaml"))
          kargo = values["kargo"]
          stages_path = kargo["stagesPath"]
          prefix = kargo["projectPrefix"]

          docs = [d for d in yaml.safe_load_all(open("/tmp/rendered.yaml")) if d]
          by_kind = {}
          for doc in docs:
              key = (doc["metadata"].get("namespace"), doc["metadata"]["name"])
              by_kind.setdefault(doc["kind"], {})[key] = doc

          status = 0

          def error(where, message):
              global status
              print(f"::error file={where}::{message}")
              status = 1

          def find(kind, name, namespace=None):
              return by_kind.get(kind, {}).get((namespace, name))

          # Every application that travels a release path, not a hard-coded
          # one: the whole point of the chart being generic is that adding an
          # application must not mean remembering to add it here too.
          promoted = {
              name: app for name, app in values["apps"].items()
              if app.get("enabled") and app.get("release")
          }
          if not promoted:
              error("argocd/values.yaml", "No application has a release path any more.")

          task_name = kargo["promotionTask"]
          if find("ClusterPromotionTask", task_name) is None:
              error("argocd/templates/kargo-promotion-task.yaml",
                    f"no ClusterPromotionTask {task_name} was rendered — every Stage "
                    "references it, so nothing could be promoted.")

          for app_name, app in promoted.items():
              project = f"{prefix}-{app_name}"
              print(f"\n=== {app_name} ({project})")

              project_config = find("ProjectConfig", project, project)
              policies = {}
              if project_config is None:
                  error("argocd/templates/kargo-projects.yaml",
                        f"no ProjectConfig {project} was rendered — nothing states which "
                        f"stages of {app_name} Kargo may promote by itself.")
              else:
                  policies = {
                      policy["stage"]: bool(policy.get("autoPromotionEnabled"))
                      for policy in project_config["spec"]["promotionPolicies"]
                  }

              for stage, cfg in app["stages"].items():
                  wanted = bool(cfg.get("autoPromotion"))
                  upstream = cfg.get("promotedFrom") or None
                  print(f"  {stage:12} autoPromotion={wanted!s:5} "
                        f"promotedFrom={upstream or '(warehouse)':12} cloud={cfg.get('cloud')}")

                  # 1. The promotion policy.
                  if stage not in policies:
                      error("argocd/templates/kargo-projects.yaml",
                            f"{project} has no promotion policy for stage {stage}.")
                  elif policies[stage] != wanted:
                      error("argocd/templates/kargo-projects.yaml",
                            f"{app_name}/{stage} renders autoPromotionEnabled="
                            f"{policies[stage]}, but values.yaml says autoPromotion="
                            f"{wanted}. A stage with autoPromotion=false must stay manual: "
                            "that is the gate in front of production.")

                  # 2. Where the Freight comes from.
                  kargo_stage = find("Stage", stage, project)
                  if kargo_stage is None:
                      error("argocd/templates/kargo-stages.yaml",
                            f"{app_name}/{stage} renders no Kargo Stage.")
                      continue
                  sources = kargo_stage["spec"]["requestedFreight"][0]["sources"]
                  if upstream:
                      if sources.get("direct"):
                          error("argocd/templates/kargo-stages.yaml",
                                f"{app_name}/{stage} takes Freight directly from the "
                                f"Warehouse, but values.yaml says it is promoted from "
                                f"{upstream}. A build that has not run upstream must not "
                                "be promotable here.")
                      if sources.get("stages") != [upstream]:
                          error("argocd/templates/kargo-stages.yaml",
                                f"{app_name}/{stage} draws Freight from "
                                f"{sources.get('stages')}, but values.yaml says {upstream}.")
                  elif not sources.get("direct"):
                      error("argocd/templates/kargo-stages.yaml",
                            f"{app_name}/{stage} has no upstream stage and does not take "
                            "Freight directly from the Warehouse, so nothing can ever be "
                            "promoted to it.")

                  # 3. The Application, and what may sync it.
                  appset = find("ApplicationSet", f"{app_name}-{stage}", "argocd")
                  if appset is None:
                      error("argocd/templates/applicationsets.yaml",
                            f"{app_name}/{stage} renders no ApplicationSet.")
                      continue
                  template = appset["spec"]["template"]
                  authorized = template["metadata"].get("annotations", {}).get(
                      "kargo.akuity.io/authorized-stage")
                  if authorized != f"{project}:{stage}":
                      error("argocd/templates/applicationsets.yaml",
                            f"{app_name}-{stage} is authorized for {authorized!r}, expected "
                            f"'{project}:{stage}'. Kargo refuses to sync an Application that "
                            "has not named the Stage acting on it, and a wrong name here "
                            "lets one stage sync another's cluster.")
                  if "automated" not in template["spec"]["syncPolicy"]:
                      error("argocd/templates/applicationsets.yaml",
                            f"{app_name}-{stage} carries no syncPolicy.automated. With Kargo "
                            "in front, the gate is the promotion, not a withheld sync — an "
                            "un-automated Application would silently stop tracking what was "
                            "promoted.")

                  # 4. The file a promotion writes is the file Argo CD reads.
                  #    Two independent references to one path, in two objects; a
                  #    rename that updated only one would leave the stage frozen
                  #    on whatever it last deployed.
                  stage_file = f"{stages_path}/{app_name}/{stage}.yaml"
                  chart_source = template["spec"]["sources"][0]
                  if f"$values/{stage_file}" not in chart_source["helm"].get("valueFiles", []):
                      error("argocd/templates/applicationsets.yaml",
                            f"{app_name}-{stage} does not read {stage_file}, so a promotion "
                            "would not change what it deploys.")
                  promo_vars = {
                      v["name"]: v.get("value")
                      for v in kargo_stage["spec"]["promotionTemplate"]["spec"]["vars"]
                  }
                  if promo_vars.get("stageFile") != stage_file:
                      error("argocd/templates/kargo-stages.yaml",
                            f"{app_name}/{stage} writes {promo_vars.get('stageFile')!r}, but "
                            f"its Application reads {stage_file}.")
                  if promo_vars.get("argocdApp") != f"{app_name}-{stage}":
                      error("argocd/templates/kargo-stages.yaml",
                            f"{app_name}/{stage} syncs Application "
                            f"{promo_vars.get('argocdApp')!r}, which is not its own.")

                  try:
                      promoted_state = yaml.safe_load(open(stage_file))
                  except FileNotFoundError:
                      error(stage_file, f"{stage_file} is missing. The ApplicationSet's "
                                        "generator reads it, so without it the stage "
                                        "produces no Application at all.")
                  else:
                      for key in ("chartRevision", "image"):
                          if key not in promoted_state:
                              error(stage_file, f"{stage_file} has no {key!r}: it is what "
                                                "the generator and the chart read back.")

              # The two halves of the promise, stated once per application rather
              # than per stage: somebody has to promote, and what they promote
              # has to have run somewhere first. A change that keeps every object
              # internally consistent can still delete the release path by
              # rewriting values.yaml, which is what these catch.
              gated = {n: c for n, c in app["stages"].items() if not c.get("autoPromotion")}
              if not gated:
                  error("argocd/values.yaml", f"No stage of {app_name} requires a person to "
                                              "promote it. At least one must.")
              elif not any(c.get("promotedFrom") for c in gated.values()):
                  error("argocd/values.yaml",
                        f"No stage of {app_name} both waits for a person and draws its "
                        "Freight from another stage. Production may only run what staging "
                        "has already run; taking Freight straight from the Warehouse would "
                        "let an unproven build be promoted.")

              for stage, cfg in app["stages"].items():
                  upstream = cfg.get("promotedFrom")
                  if upstream and upstream not in app["stages"]:
                      error("argocd/values.yaml", f"{app_name}/{stage} is promoted from "
                                                  f"{upstream!r}, which is not one of its "
                                                  "stages.")

          sys.exit(status)
          PY

  onboarding:
    name: a new application is values-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      # The framework's promise: onboarding an application is an entry under
      # "apps:" — not a new template, not a Warehouse file of its own, and not a
      # copy of the promotion steps. tests/onboarding-values.yaml is a second
      # application expressed that way and deployed nowhere; this renders the
      # chart with it on top and asserts that a complete, isolated release path
      # appeared.
      #
      # A README sentence claiming this would not notice the day it stopped
      # being true. This does.
      - name: A values overlay produces a whole release path
        run: |
          helm template platform-gitops argocd -f tests/onboarding-values.yaml > /tmp/onboarded.yaml
          python3 - <<'PY'
          import sys, yaml

          docs = [d for d in yaml.safe_load_all(open("/tmp/onboarded.yaml")) if d]
          got = {(d["kind"], d["metadata"].get("namespace"), d["metadata"]["name"]) for d in docs}

          status = 0
          def want(kind, namespace, name, why):
              global status
              if (kind, namespace, name) not in got:
                  print(f"::error file=tests/onboarding-values.yaml::onboarding produced no "
                        f"{kind} {namespace or ''}/{name} — {why}")
                  status = 1

          want("Project", None, "onek8s-example", "an application needs its own Kargo Project")
          want("ProjectConfig", "onek8s-example", "onek8s-example", "nothing would say which stages auto-promote")
          want("Warehouse", "onek8s-example", "example", "nothing would turn its builds into Freight")
          for stage in ("staging", "production"):
              want("Stage", "onek8s-example", stage, "the release path would be incomplete")
              want("ApplicationSet", "argocd", f"example-{stage}", "nothing would deploy it")

          # Isolation: its own Project namespace, and promoters that are its own.
          role = [d for d in docs if d["kind"] == "Role"
                  and d["metadata"]["namespace"] == "onek8s-example"]
          if not role:
              print("::error file=argocd/templates/kargo-projects.yaml::the onboarded "
                    "application got no promoter Role of its own.")
              status = 1
          else:
              names = [r for rule in role[0]["rules"] for r in rule.get("resourceNames", [])]
              if names != ["production"]:
                  print(f"::error file=argocd/templates/kargo-projects.yaml::promoter Role "
                        f"grants promote on {names}, expected only the gated stage.")
                  status = 1

          # The part that must NOT multiply: one shared promotion procedure,
          # however many applications there are.
          tasks = [d for d in docs if d["kind"] == "ClusterPromotionTask"]
          if len(tasks) != 1:
              print(f"::error file=argocd/templates/kargo-promotion-task.yaml::{len(tasks)} "
                    "ClusterPromotionTasks rendered for two applications. The promotion "
                    "procedure is shared; one per application is how a platform ends up with "
                    "fifty copies of one bug.")
              status = 1
          for stage in [d for d in docs if d["kind"] == "Stage"]:
              steps = stage["spec"]["promotionTemplate"]["spec"]["steps"]
              if [s.get("task", {}).get("name") for s in steps] != [tasks[0]["metadata"]["name"]]:
                  print(f"::error file=argocd/templates/kargo-stages.yaml::Stage "
                        f"{stage['metadata']['namespace']}/{stage['metadata']['name']} does not "
                        "delegate to the shared ClusterPromotionTask.")
                  status = 1

          sys.exit(status)
          PY
