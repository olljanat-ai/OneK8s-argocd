{{- if and .Values.apps.dbHello.enabled .Values.sql.server .Values.sql.database }}
# "Deploy the db-hello app to the cloud that has the database", as one object.
#
# One generator and no stages: unlike hello, this application is Azure-only and
# says so. Its database is an Azure resource and its identity is an Entra one,
# so there is no AWS production stage it could be promoted to — a second stage
# here would be a promise the application cannot keep. The hub is the one
# cluster, and Argo CD addresses the cluster it runs on as "in-cluster".
#
# The whole thing disappears when the Azure foundation was applied with
# enable_sql = false: the OneK8s repository's gitops/root-app.tf then passes an
# empty sql.server, the guard above is false, and no Application is generated. Nothing has to be
# switched off in two places.
#
# NOTE ON BRACES: Helm and Argo CD both use Go templates, and this file is
# rendered by both. Anything wrapped in a backtick-quoted Helm literal comes
# through untouched and is evaluated later by the ApplicationSet controller;
# everything else is substituted by Helm at sync time from values.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: db-hello
  namespace: {{ .Values.argocdNamespace }}
  labels:
    app.kubernetes.io/part-of: onek8s
    onek8s.io/environment: {{ .Values.environment | quote }}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - list:
        elements:
          - values:
              cloud: {{ .Values.apps.dbHello.hub.cloud | quote }}
              cluster: {{ .Values.apps.dbHello.hub.cluster | quote }}

  template:
    metadata:
      name: 'db-hello-{{`{{ .values.cloud }}`}}'
      labels:
        app.kubernetes.io/part-of: onek8s
        onek8s.io/cloud: '{{`{{ .values.cloud }}`}}'
        onek8s.io/environment: {{ .Values.environment | quote }}
    spec:
      project: {{ .Values.project.name }}
      source:
        # The applications' repository, not this one.
        repoURL: {{ .Values.appsRepoURL | quote }}
        targetRevision: {{ .Values.appsTargetRevision | quote }}
        path: {{ .Values.apps.dbHello.path | quote }}
        helm:
          parameters:
            - name: cloud
              value: '{{`{{ .values.cloud }}`}}'
            - name: environment
              value: {{ .Values.environment | quote }}
            - name: tenant
              value: {{ .Values.tenant | quote }}
            # One label deep, which is all the wildcard covers.
            - name: ingress.host
              value: '{{`{{ .values.cloud }}`}}-{{ .Values.apps.dbHello.hostPrefix }}.{{ .Values.domain }}'
            # Where the database is. Read out of the Azure foundation's state
            # by the OneK8s gitops stack and passed through here, so no host name is
            # committed per environment and a rebuilt server (the name carries
            # a random suffix) reaches the application on the next apply.
            - name: sql.server
              value: {{ .Values.sql.server | quote }}
            - name: sql.database
              value: {{ .Values.sql.database | quote }}
            - name: welcomeMessage
              value: 'Welcome to OneK8s on {{`{{ .values.cloud }}`}} ({{ .Values.environment }}), with a database!'
      destination:
        name: '{{`{{ .values.cluster }}`}}'
        namespace: {{ .Values.tenant | quote }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # The namespace belongs to the tenants stack, and so does the
          # ServiceAccount this pod runs as. A missing namespace should fail
          # the sync loudly rather than produce one with no identity in it.
          - CreateNamespace=false
      revisionHistoryLimit: 3
{{- end }}
