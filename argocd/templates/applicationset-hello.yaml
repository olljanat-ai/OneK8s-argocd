{{- if .Values.apps.hello.enabled }}
{{- $root := . }}
{{- $app := .Values.apps.hello }}
{{- $secret := $app.secret }}
{{- /*
The tenant's test secret, spelled the way each backend spells it. This is the
only string on the platform that is not the same word on every cloud, and
resolving it here is deliberate: Key Vault names are flat because each
environment has its own vault, while Secrets Manager is account-wide, so the
tenant's IAM role there is restricted to "<environment>/<tenant>/*"
(modules/tenant-namespace/aws/main.tf in the OneK8s repository).

The application's chart is handed the finished key and never learns which cloud
it landed on — a developer's chart has no business branching on that.
*/}}
{{- $flatKey := printf "%s-%s" .Values.tenant $secret.name }}
{{- $pathKey := printf "%s/%s/%s" .Values.environment .Values.tenant $secret.name }}
# "Deploy the hello app along its release path", as one object per stage.
#
#   hello-staging     Azure / AKS (the hub)   auto-promoted by Kargo
#   hello-production  AWS   / EKS (a spoke)   promoted by a human, from staging
#
# Both Applications are auto-synced, and that is the point: with Kargo in front,
# what production runs is decided before Argo CD ever sees it. The gate is the
# absence of a commit — "stages/hello/production.yaml" still names the previous
# build — rather than the absence of a sync policy, so it cannot be lifted by
# editing this file, it is visible in `git log`, and it names whoever opened it.
#
# Each Application therefore has two sources:
#
#   1. the application's chart, at the revision this stage was promoted to
#   2. this repository, as a plain values reference, for the file Kargo writes
#
# and both of them are pinned by "stages/hello/<stage>.yaml":
#
#   chartRevision   consumed by the generator below, as the chart source's
#                   targetRevision — a chart change is promoted, not inherited
#   image.tag       consumed by Argo CD as a Helm values file, so a new build
#                   is a value change on an otherwise identical Application
#
# One ApplicationSet per stage rather than one for the whole application,
# because the two stages find their cluster differently and because each carries
# the Kargo authorization for its own stage and nothing else.
#
# How the cluster is found follows from the topology rather than from the stage:
# the hub has no cluster Secret and therefore no labels to select on, so it is
# named ("in-cluster"), while a spoke is matched by the labels the gitops stack
# put on the Secret it wrote. A stage whose cloud is not registered as a spoke
# in this environment generates nothing at all.
#
# NOTE ON BRACES: Helm and Argo CD both use Go templates, and this file is
# rendered by both. Anything wrapped in a backtick-quoted Helm literal comes
# through untouched and is evaluated later by the ApplicationSet controller;
# everything else is substituted by Helm at sync time from values.yaml.
{{- range $stage, $cfg := $app.stages }}
{{- $stageFile := printf "%s/hello/%s.yaml" $root.Values.kargo.stagesPath $stage }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hello-{{ $stage }}
  namespace: {{ $root.Values.argocdNamespace }}
  labels:
    app.kubernetes.io/part-of: onek8s
    onek8s.io/environment: {{ $root.Values.environment | quote }}
    onek8s.io/stage: {{ $stage | quote }}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    # A matrix of "what this stage runs" and "where it runs". Both halves are
    # single-valued, so it produces one Application — or none, when the cloud
    # this stage names is not a registered spoke in this environment.
    - matrix:
        generators:
          # What: the file Kargo writes when this stage is promoted. Reading it
          # here rather than hard-coding a revision is what makes a promotion
          # take effect: the next time this generator runs, the chart source
          # points at the revision that was promoted.
          - git:
              repoURL: {{ $root.Values.repoURL | quote }}
              revision: {{ $root.Values.targetRevision | quote }}
              files:
                - path: {{ $stageFile | quote }}

          # Where.
          {{- if $cfg.cluster }}
          # A named cluster: the hub (AKS), which Argo CD addresses as
          # "in-cluster" and which has no Secret to select on.
          - list:
              elements:
                - values:
                    cloud: {{ $cfg.cloud | quote }}
                    cluster: {{ $cfg.cluster | quote }}
          {{- else }}
          # The spoke of this cloud, if the gitops stack registered one for this
          # environment. No spoke, no Application.
          - clusters:
              selector:
                matchLabels:
                  onek8s.io/environment: {{ $root.Values.environment | quote }}
                  onek8s.io/cloud: {{ $cfg.cloud | quote }}
              values:
                cloud: {{ $cfg.cloud | quote }}
                cluster: '{{`{{ .name }}`}}'
          {{- end }}

  template:
    metadata:
      name: hello-{{ $stage }}
      annotations:
        # Kargo's argocd-update step refuses to touch an Application that has
        # not named the Stage acting on it. One entry, so the production Stage
        # cannot sync staging's Application or the other way round.
        kargo.akuity.io/authorized-stage: {{ printf "%s:%s" $root.Values.kargo.project $stage | quote }}
      labels:
        app.kubernetes.io/part-of: onek8s
        onek8s.io/cloud: {{ $cfg.cloud | quote }}
        onek8s.io/environment: {{ $root.Values.environment | quote }}
        onek8s.io/stage: {{ $stage | quote }}
    spec:
      project: {{ $root.Values.project.name }}
      sources:
        # 1. The applications' repository, at the revision promoted to this
        #    stage: this chart says where the hello app is deployed,
        #    apps/hello/chart says what it is.
        - repoURL: {{ $root.Values.appsRepoURL | quote }}
          targetRevision: '{{`{{ .chartRevision }}`}}'
          path: {{ $app.path | quote }}
          helm:
            # The promoted build, read straight out of the same file. A
            # values file rather than a parameter on purpose: Argo CD then
            # tracks the file's repository as a source of the Application, so a
            # promotion shows up as an out-of-sync Application within seconds
            # instead of waiting for this generator to run again.
            valueFiles:
              - {{ printf "$values/%s" $stageFile | quote }}
            # Parameters rather than a values block: they are plain strings, so
            # the substitutions below are unambiguous, and they override the
            # chart's own values.yaml without duplicating it.
            parameters:
              - name: cloud
                value: {{ $cfg.cloud | quote }}
              - name: environment
                value: {{ $root.Values.environment | quote }}
              - name: tenant
                value: {{ $root.Values.tenant | quote }}
              # One label deep, which is all the *.{{ $root.Values.domain }} wildcard covers.
              - name: ingress.host
                value: '{{ $cfg.cloud }}-{{ $app.hostPrefix }}.{{ $root.Values.domain }}'
              - name: secret.name
                value: {{ $secret.name | quote }}
              # Resolved here, from the two spellings computed above: a path on
              # Secrets Manager, a flat name everywhere else. The stage fixes
              # the cloud, so this is decided at render time rather than per
              # cluster.
              - name: secret.remoteKey
                value: {{ if eq $cfg.cloud "aws" }}{{ $pathKey | quote }}{{ else }}{{ $flatKey | quote }}{{ end }}
              - name: welcomeMessage
                value: 'Welcome to OneK8s on {{ $cfg.cloud }} ({{ $root.Values.environment }}, {{ $stage }})!'

        # 2. This repository, as a values reference only — no path, nothing
        #    rendered from it. It exists so that "$values" above resolves.
        - repoURL: {{ $root.Values.repoURL | quote }}
          targetRevision: {{ $root.Values.targetRevision | quote }}
          ref: values
      destination:
        # By name, not by server URL: a spoke's API endpoint is whatever EKS
        # happened to hand out, and Argo CD already knows it from the cluster
        # Secret the gitops stack wrote.
        name: '{{`{{ .values.cluster }}`}}'
        namespace: {{ $root.Values.tenant | quote }}
      syncPolicy:
        # Automated on both stages. Kargo decides what each stage runs; Argo CD
        # only makes the cluster match it, and should do so without waiting to
        # be asked — including when somebody edits a live object by hand
        # (selfHeal) or a promotion removes one (prune).
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # The namespace belongs to the tenants stack. If it is missing, the
          # sync should fail loudly rather than have Argo CD create a namespace
          # with none of the tenant's quota, network policy or SecretStore.
          - CreateNamespace=false
      revisionHistoryLimit: 3
{{- end }}
{{- end }}
