{{- if and .Values.kargo.enabled .Values.apps.hello.enabled }}
{{- $root := . }}
{{- $kargo := .Values.kargo }}
{{- $app := .Values.apps.hello }}
# The hello application's release path, one Stage per cluster.
#
#   staging     Azure / AKS (the hub)   auto-promoted: every new Freight lands
#   production  AWS   / EKS (a spoke)   promoted by a person, only from staging
#
# A Stage holds one piece of Freight and knows how to put it there. Promoting is
# not "press sync": it is the promotionTemplate below, which clones this
# repository, writes the promoted image tag and chart revision into
# "stages/hello/<stage>.yaml", commits, pushes, and then asks Argo CD to sync
# the Application that reads that file. So every promotion leaves a commit
# naming what moved, when, and — for the ones a person asked for — who asked.
#
# Two things make production a gate, and neither is a sync policy:
#
#   sources.stages   production draws Freight from staging, not from the
#                    Warehouse. A build that has never run on AKS cannot be put
#                    on EKS, even by somebody allowed to promote.
#   autoPromotion    false in the ProjectConfig, so Kargo creates no Promotion
#                    for it. The Freight becomes available and waits.
#
# NOTE ON BRACES: Helm and Kargo both spell an expression with braces, and this
# file is read by both. A Kargo expression is wrapped in a backtick-quoted Helm
# literal so that Helm passes it through untouched and the promotion engine
# evaluates it later; everything else is substituted by Helm at sync time from
# values.yaml.
{{- range $stage, $cfg := $app.stages }}
{{- $stageFile := printf "%s/hello/%s.yaml" $kargo.stagesPath $stage }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: {{ $stage | quote }}
  namespace: {{ $kargo.project | quote }}
  annotations:
    kargo.akuity.io/description: >-
      hello on {{ $cfg.cloud }} ({{ $root.Values.environment }}) —
      https://{{ $cfg.cloud }}-{{ $app.hostPrefix }}.{{ $root.Values.domain }}
  labels:
    app.kubernetes.io/part-of: onek8s
    onek8s.io/cloud: {{ $cfg.cloud | quote }}
    onek8s.io/environment: {{ $root.Values.environment | quote }}
    onek8s.io/stage: {{ $stage | quote }}
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: hello
      sources:
        {{- if $cfg.promotedFrom }}
        # Upstream, not the Warehouse: this stage can only receive what the
        # stage before it has already run.
        stages:
          - {{ $cfg.promotedFrom | quote }}
        {{- with $cfg.soakTime }}
        # ...and only after it has run there this long.
        requiredSoakTime: {{ . | quote }}
        {{- end }}
        {{- else }}
        # The head of the release path: new Freight enters here.
        direct: true
        {{- end }}

  promotionTemplate:
    spec:
      vars:
        - name: repoURL
          value: {{ $root.Values.repoURL | quote }}
        - name: branch
          value: {{ $root.Values.targetRevision | quote }}
        - name: appsRepoURL
          value: {{ $root.Values.appsRepoURL | quote }}
        - name: imageRepoURL
          value: {{ $app.image.repository | quote }}

      steps:
        # 1. The delivery-plane repository, which is also this one. Kargo needs
        #    a credential that may push to it: a Secret labelled
        #    kargo.akuity.io/cred-type=git, created out of band in the Project's
        #    namespace or in the cluster's shared-credentials namespace (see the
        #    README). It is the one credential this design has, and it can do
        #    exactly one thing — write to a Git repository.
        - uses: git-clone
          config:
            repoURL: {{`${{ vars.repoURL }}`}}
            author:
              name: {{ $kargo.author.name | quote }}
              email: {{ $kargo.author.email | quote }}
            checkout:
              - branch: {{`${{ vars.branch }}`}}
                path: ./repo

        # 2. Write down what this stage runs. Two lines in one small file, and
        #    they are the whole of the promotion: everything else — which
        #    cluster, which host, which secret — belongs to the stage rather
        #    than to the release and is rendered by the ApplicationSet.
        - uses: yaml-update
          config:
            path: {{ printf "./repo/%s" $stageFile | quote }}
            updates:
              - key: image.tag
                value: {{`${{ imageFrom(vars.imageRepoURL).Tag }}`}}
              - key: chartRevision
                value: {{`${{ commitFrom(vars.appsRepoURL).ID }}`}}

        # 3. The record. A promotion nobody can find afterwards is not much of
        #    an audit trail, so the message carries the Freight, the artifacts
        #    and — for a promotion somebody asked for — their name.
        - uses: git-commit
          config:
            path: ./repo
            message: |-
              hello/{{ $stage }}: promote {{`${{ imageFrom(vars.imageRepoURL).Tag }}`}}

              Freight:   {{`${{ ctx.targetFreight.name }}`}}
              Chart:     {{`${{ commitFrom(vars.appsRepoURL).ID }}`}}
              Promotion: {{`${{ ctx.promotion }}`}}
              Requested: {{`${{ ctx.meta.promotion.actor == '' ? 'kargo (auto-promotion)' : ctx.meta.promotion.actor }}`}}

        - uses: git-push
          as: push
          config:
            path: ./repo
            targetBranch: {{`${{ vars.branch }}`}}

        # 4. Argo CD does the applying, as it always did. This asks it to look
        #    now rather than on its next refresh, and waits until the
        #    Application is synced at both of the revisions this promotion
        #    fixed — the chart's, and the commit just pushed — and healthy.
        #    Without that wait, a promotion would report success while the old
        #    pods were still serving.
        - uses: argocd-update
          config:
            apps:
              - name: hello-{{ $stage }}
                namespace: {{ $root.Values.argocdNamespace | quote }}
                sources:
                  - repoURL: {{`${{ vars.appsRepoURL }}`}}
                    desiredRevision: {{`${{ commitFrom(vars.appsRepoURL).ID }}`}}
                  - repoURL: {{`${{ vars.repoURL }}`}}
                    desiredRevision: {{`${{ outputs.push.commit }}`}}
{{- end }}
{{- end }}
