{{- $root := . }}
# What a release of each application is made of.
#
# A Warehouse watches two things and freezes them together as one piece of
# Freight: the image build, and the chart it is deployed with. Freight is
# immutable — it names a tag and a commit, not "whatever main says" — which is
# what makes a promotion a statement about a specific build rather than about a
# moment in time. Promoting the same Freight twice deploys the same thing twice.
#
# Both subscriptions matter. With only the image, a chart change would reach
# every stage the moment it merged, which is the hole the old delivery plane had
# in a different shape: the gate would cover the application's code and not the
# manifests that run it.
{{- range $name, $app := .Values.apps }}
{{- if and (include "onek8s.appEnabled" (dict "root" $root "app" $app)) (include "onek8s.kargoManaged" (dict "root" $root "app" $app)) }}
{{- $release := $app.release }}
{{- $image := $release.image }}
{{- $chartPaths := default (list $app.chartPath) $release.chartPaths }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: {{ $name | quote }}
  namespace: {{ include "onek8s.kargoProject" (dict "root" $root "name" $name) | quote }}
  annotations:
    kargo.akuity.io/description: >-
      The {{ $name }} application's image builds and the chart they are deployed
      with, as Freight.
  labels:
    app.kubernetes.io/part-of: onek8s
    app.kubernetes.io/name: {{ $name }}
    onek8s.io/environment: {{ $root.Values.environment | quote }}
spec:
  # How often Kargo looks, when no webhook has told it to look sooner.
  interval: {{ $release.interval | default "5m" | quote }}
  freightCreationPolicy: Automatic

  subscriptions:
    # The image the application's build workflow pushes.
    - image:
        repoURL: {{ $image.repository | quote }}
        # SemVer for an application with releases, NewestBuild for one whose
        # tags are content-addressed and have no order of their own. See
        # values.yaml.
        imageSelectionStrategy: {{ $image.selectionStrategy | default "SemVer" | quote }}
        {{- with $image.tagRegexes }}
        allowTagsRegexes:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if eq ($image.selectionStrategy | default "SemVer") "SemVer" }}
        {{- with $image.semverConstraint }}
        semverConstraint: {{ . | quote }}
        {{- end }}
        strictSemvers: {{ $image.strictSemvers | default true }}
        {{- end }}
        discoveryLimit: {{ $image.discoveryLimit | default 20 }}
        # The pods pull by tag and the platform has no pull secret anywhere, so
        # the packages are public and this subscription needs no credentials.

    # The chart, in the applications repository. Restricted to the paths that
    # actually describe the deployment, so a commit that only touches the
    # application's source produces a new image and no new chart revision.
    - git:
        repoURL: {{ include "onek8s.appsRepoURL" (dict "root" $root "app" $app) | quote }}
        branch: {{ $root.Values.appsTargetRevision | quote }}
        commitSelectionStrategy: NewestFromBranch
        includePaths:
          {{- toYaml $chartPaths | nindent 10 }}
        discoveryLimit: {{ $image.discoveryLimit | default 20 }}
{{- end }}
{{- end }}
