# The AppProject every platform application belongs to. Argo CD's "default"
# project allows any repository, any cluster and any namespace, which is the
# gap docs/argocd.md lists under "Known gaps"; this closes it for everything
# the root Application brings in.
#
# Three boundaries, all of them enforced by Argo CD before a manifest is
# applied:
#
#   sourceRepos               only the platform's two repositories may be synced
#   destinations              only the tenant namespace, on any registered cluster
#   clusterResourceWhitelist  empty: nothing cluster-scoped, ever
#
# The last one is the mechanism behind the convention that tenant onboarding
# (namespaces, quotas, SecretStores) stays in Terraform and only workloads
# belong in GitOps: an Application that tried to manage a Namespace would be
# refused here rather than quietly fighting the tenants stack over it.
#
# It says nothing about *what* an Application deploys or *when* — both
# Applications here are auto-synced, and which revision each one runs is
# decided upstream of Argo CD by Kargo (kargo-stages-hello.yaml).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .Values.project.name }}
  namespace: {{ .Values.argocdNamespace }}
  labels:
    app.kubernetes.io/part-of: onek8s
    onek8s.io/environment: {{ .Values.environment | quote }}
    {{- if .Values.agent.enabled }}
    # The AppProject has to reach the agents too, not just the Applications.
    # A spoke's Argo CD validates every Application it is handed against the
    # project it names, and an unlabelled AppProject is invisible to the
    # principal — so it would never be distributed, and every Application on
    # every spoke would sit in "Unknown" reporting a project that does not
    # exist there.
    #
    # It is distributed to an agent whose name matches one of .spec.destinations
    # below, which the "name: *" entry covers.
    {{ .Values.agent.label }}: "true"
    {{- end }}
spec:
  description: >-
    OneK8s platform applications ({{ .Values.environment }}) — the platform's
    own repositories only, namespaced resources only, in the
    {{ .Values.tenant }} namespace.
  # This repository, plus every repository any application's chart comes from —
  # computed from apps.<name>.repoURL rather than listed, so onboarding a team
  # with its own applications repository cannot be half-done. Anything not in
  # this list is refused by Argo CD before a manifest is fetched.
  sourceRepos:
    - {{ .Values.repoURL | quote }}
    {{- $repos := list .Values.appsRepoURL }}
    {{- range $name, $app := .Values.apps }}
    {{- $repos = append $repos (default $.Values.appsRepoURL $app.repoURL) }}
    {{- end }}
    {{- range $repos | uniq | sortAlpha }}
    - {{ . | quote }}
    {{- end }}
  # Two entries because an Application may address its cluster either way: the
  # ApplicationSets use destination.name (the name Argo CD knows the
  # cluster by), while a hand-written Application usually names the server URL.
  #
  # The "name" entry carries a second job under argocd-agent: the principal
  # decides which agents an AppProject is distributed to by matching their names
  # against these entries as globs. "*" means every agent gets it, which is what
  # a platform-wide project wants — narrow it and a spoke left out has
  # Applications it cannot validate.
  destinations:
    - server: "*"
      namespace: {{ .Values.tenant | quote }}
    - name: "*"
      namespace: {{ .Values.tenant | quote }}
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
