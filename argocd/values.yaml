# Defaults for a manual `helm template`. In a deployed environment every value
# down to "apps" is overridden by the root Application, which OneK8s'
# gitops/root-app.tf renders from var.environment and var.platform_apps — so one
# copy of this chart serves prototype, dev, staging and prod without a
# per-environment directory.

# Selects the spokes an ApplicationSet's cluster generator matches
# (onek8s.io/environment on the cluster Secret), and is passed on to the
# applications themselves. This is the *platform* environment — which set of
# foundations these clusters belong to — and it is a different axis from the
# per-application stages below: one platform environment holds both the staging
# cluster and the production cluster of the hello application.
environment: prototype

# This repository. Three things read it: the root Application syncs it (the
# objects in templates/ are rendered from it), the AppProject allow-lists it,
# and Kargo commits to it — a promotion is a commit under "stages/" here.
repoURL: https://github.com/olljanat-ai/OneK8s-argocd.git
targetRevision: main

# Where the applications' charts come from. Separate from the repository above
# on purpose: an application's source and chart belong to the team that owns the
# application, while the Argo CD objects that deploy it belong to the platform.
# A developer changing a chart never touches the delivery plane, and a change to
# the delivery plane never rebuilds an image.
appsRepoURL: https://github.com/olljanat-ai/OneK8s-hello.git
appsTargetRevision: main

# Namespace the Argo CD extension is released into on the hub.
argocdNamespace: argocd

# The wildcard the platform ingress serves. Application hosts are one label
# deep under it: "<cloud>-<app>.<domain>".
domain: onek8s.lol

# Tenant namespace the platform's example applications are released into. It is
# created by the tenants stack — Argo CD never creates it — and its namespaced
# SecretStore is what the applications read secrets through.
tenant: team-alpha

# The Azure SQL database the db-hello application uses, handed down from the
# Azure foundation's outputs by OneK8s' gitops/root-app.tf. Neither value is a
# secret: a host name and a database name authorize nobody, and the application
# authenticates with the tenant's managed identity.
#
# Empty means this environment's foundation was applied with enable_sql =
# false, and then the db-hello ApplicationSet is not rendered at all — no
# database, no application, and nothing to keep in sync between the two.
sql:
  server: ""
  database: ""

project:
  name: onek8s-platform

# -----------------------------------------------------------------------------
# Kargo: the promotion engine in front of Argo CD.
#
# Argo CD answers "is the cluster what Git says it is" and has no opinion about
# which revision belongs on which cluster. Kargo answers that second question
# and writes the answer down: a Warehouse watches the application's image and
# chart and freezes each new build as a piece of Freight; a Stage carries one
# piece of Freight; and promoting a Stage is a commit under "stages/" in this
# repository, which Argo CD then syncs like any other commit.
#
# That is why no Application here is left un-automated any more. The gate in
# front of production is not "Argo CD has been told not to apply this" — it is
# "no commit says production runs that build yet", which cannot be undone by
# adding a sync policy back, is visible in `git log`, and names the person who
# opened it.
#
# enabled is set by Terraform from the hub's outputs: false when the hub was
# applied with enable_kargo = false, and then this chart renders no Kargo
# objects at all rather than a release path nothing reconciles.
kargo:
  enabled: true

  # Namespace the Kargo controller runs in on the hub. Informational here — the
  # objects below live in the Project's namespace, not this one.
  namespace: kargo

  # Base URL of the Kargo UI, for the deep link on each Stage. Empty when the
  # hub runs Kargo controller-only (no app registration configured yet).
  url: ""

  # The Kargo Project the platform's applications are promoted in. Kargo creates
  # a namespace of the same name and every Warehouse, Stage and Promotion below
  # lives in it.
  project: onek8s-hello

  # Where promotions are written, relative to the root of this repository:
  # "<stagesPath>/<app>/<stage>.yaml". Those files are the ones Argo CD reads
  # back — see templates/applicationset-hello.yaml.
  stagesPath: stages

  # Authorship of the commits Kargo makes. It is a bot, and the history should
  # say so plainly rather than borrow a person's name.
  author:
    name: kargo
    email: kargo@onek8s.lol

  # Who may promote to a stage that is not auto-promoted, as Entra ID group
  # object IDs (the "groups" claim Kargo's OIDC config requests). This is the
  # approval gate's guest list, and it is deliberately here rather than in
  # Terraform: it belongs beside the Stage it guards, and changing it is a
  # reviewed commit.
  #
  # Empty means only Kargo's own admins can promote, which is the safe default
  # but not a useful one — an environment that wants a named group of promoters
  # lists it here.
  promoters: []

  # A GitHub webhook that tells Kargo to re-check the repositories at once
  # instead of on the Warehouse's polling interval. The receiver needs a shared
  # secret, which is not configuration and is not committed: create the Secret
  # in the Project's namespace out of band and name it here (see the README).
  webhook:
    enabled: false
    secretName: kargo-github-webhook

apps:
  hello:
    enabled: true
    # Chart path inside the applications' repository.
    path: apps/hello/chart
    # Host label: "<cloud>-hello.<domain>".
    hostPrefix: hello
    # The tenant secret the application displays. Its name is the tenant's, not
    # a cloud's; the ApplicationSet turns it into the key each cloud's backend
    # actually uses ("<tenant>-<name>", or "<environment>/<tenant>/<name>" on
    # AWS Secrets Manager) and passes that to the chart ready-made.
    #
    # It must match TEST_SECRET in OneK8s' .github/workflows/renew-certificate.yml,
    # which is what writes the value into every backend.
    secret:
      name: test

    # ---------------------------------------------------------------------
    # What a piece of this application's Freight is made of: one image build
    # and the chart it is deployed with. Both are watched by the Warehouse, and
    # both are pinned per stage by a promotion — so a chart change reaches
    # production the same way an image does, through the gate, rather than
    # slipping past it because only the image was ever promoted.
    # ---------------------------------------------------------------------
    image:
      repository: ghcr.io/olljanat-ai/onek8s-hello/hello
      # Immutable build tags only. The build workflow in OneK8s-hello pushes
      # "sha-<short>" and nothing else — no moving "latest" — which is what
      # makes "the tag in Git" and "the image running" the same statement.
      tagRegex: ^sha-[0-9a-f]{7,40}$
      # How many tags Kargo considers when looking for the newest build. The
      # strategy is NewestBuild, which reads each candidate's creation time, so
      # this is a real cost per discovery run rather than a formality.
      discoveryLimit: 20

    # How often the Warehouse looks for a new build or a chart change. The
    # webhook above makes this a backstop rather than the normal path.
    interval: 5m

    # ---------------------------------------------------------------------
    # The application's release path: one Kargo Stage per cluster, in order.
    # This is what makes the two clouds mean something different rather than
    # being two copies of the same deployment:
    #
    #   staging     Azure (AKS, the hub)   auto-promoted: every new build lands
    #   production  AWS   (EKS, a spoke)   promoted by a human, from staging
    #
    # A stage names either a "cluster" (a fixed cluster Argo CD already knows,
    # used for the hub, which has no labelled cluster Secret to select on) or
    # only a "cloud" (matched by label against the spokes the gitops stack
    # registered for this environment — so a cloud that is not a spoke here
    # simply produces no Application).
    #
    # Two fields make the gate:
    #
    #   autoPromotion  false means Kargo creates no Promotion by itself. The
    #                  Freight becomes *available* to the stage and waits for a
    #                  person, in the UI, with `kargo promote`, or as a
    #                  Promotion object.
    #   promotedFrom   the stage this one draws Freight from. Production may
    #                  only take what staging has already run, so an untested
    #                  build cannot be promoted straight to AWS even by
    #                  somebody who is allowed to promote.
    # ---------------------------------------------------------------------
    stages:
      staging:
        cloud: azure
        # The hub is not a spoke: Argo CD addresses the cluster it runs on as
        # "in-cluster" and it carries no cluster Secret, so it is named rather
        # than selected.
        cluster: in-cluster
        # Empty promotedFrom means the Warehouse itself: staging is where new
        # Freight enters the release path.
        promotedFrom: ""
        autoPromotion: true
      production:
        # Selected by label: the AWS spoke's cluster Secret is written and
        # labelled by the gitops stack in the OneK8s repository.
        cloud: aws
        promotedFrom: staging
        autoPromotion: false
        # Optional: how long a piece of Freight must have been running in the
        # stage it comes from before it can be promoted on. Empty means no
        # soak, which is right for a lab; "2h" would mean production can only
        # take a build staging has survived for two hours.
        soakTime: ""

  # The Azure-only example: a database application authenticating with the
  # tenant's managed identity. It is deployed to the hub and nowhere else, and
  # only when "sql" above is filled in — its database is an Azure resource and
  # its identity is an Entra one, so it has no production stage on AWS to be
  # promoted to, and no Kargo objects either: an application with one stage has
  # no release *path*, and pretending otherwise would add a promotion that
  # promotes nothing anywhere.
  dbHello:
    enabled: true
    # Chart path inside the applications' repository.
    path: apps/db-hello/chart
    # Host label: "azure-db-hello.<domain>".
    hostPrefix: db-hello
    hub:
      cloud: azure
      cluster: in-cluster
