# Defaults for a manual `helm template`. In a deployed environment every value
# down to "apps" is overridden by the root Application, which OneK8s'
# gitops/root-app.tf renders from var.environment and var.platform_apps — so one
# copy of this chart serves prototype, dev, staging and prod without a
# per-environment directory.
#
# Nothing below "apps" is application-specific either. The templates range over
# that map, so onboarding an application is an entry here — not a new template,
# not a new Warehouse file, not a copy of a promotion workflow. See "Adding an
# application" in the README.

# Selects the spokes an ApplicationSet's cluster generator matches
# (onek8s.io/environment on the cluster Secret), and is passed on to the
# applications themselves. This is the *platform* environment — which set of
# foundations these clusters belong to — and it is a different axis from the
# per-application stages below: one platform environment holds both the staging
# cluster and the production cluster of the hello application.
environment: prototype

# This repository. Three things read it: the root Application syncs it (the
# objects in templates/ are rendered from it), the AppProject allow-lists it,
# and Kargo commits to it — a promotion is a commit under "stages/" here.
repoURL: https://github.com/olljanat-ai/OneK8s-argocd.git
targetRevision: main

# Where the applications' charts come from. Separate from the repository above
# on purpose: an application's source and chart belong to the team that owns the
# application, while the Argo CD objects that deploy it belong to the platform.
# A developer changing a chart never touches the delivery plane, and a change to
# the delivery plane never rebuilds an image.
#
# An application may override it (apps.<name>.repoURL) once the platform has
# more than one applications repository — every repository named by any
# application is allow-listed in the AppProject automatically.
appsRepoURL: https://github.com/olljanat-ai/OneK8s-hello.git
appsTargetRevision: main

# Namespace the Argo CD extension is released into on the hub.
argocdNamespace: argocd

# The wildcard the platform ingress serves. Application hosts are one label
# deep under it: "<cloud>-<app>.<domain>".
domain: onek8s.lol

# Tenant namespace the platform's example applications are released into. It is
# created by the tenants stack — Argo CD never creates it — and its namespaced
# SecretStore is what the applications read secrets through.
tenant: team-alpha

# The Azure SQL database the db-hello application uses, handed down from the
# Azure foundation's outputs by OneK8s' gitops/root-app.tf. Neither value is a
# secret: a host name and a database name authorize nobody, and the application
# authenticates with the tenant's managed identity.
#
# Empty means this environment's foundation was applied with enable_sql =
# false, and then db-hello is not rendered at all — see its "requires" below.
sql:
  server: ""
  database: ""

project:
  name: onek8s-platform

# -----------------------------------------------------------------------------
# argocd-agent: how a stage that runs on a spoke actually gets there.
#
# The hub is the only cluster with an Argo CD anybody signs in to, and it is the
# only place an Application is created — that has not changed. What changed is
# the last hop. Argo CD used to hold a cluster-admin token for each spoke and
# apply manifests to it over its public Kubernetes API; now each spoke runs an
# argocd-agent agent that dials the hub outwards, and the principal on the hub
# routes each Application to the agent named by its spec.destination.name. The
# spoke's own Argo CD does the applying.
#
# For this chart that is one label and nothing else. Everything below it —
# generators, destinations, Kargo, the stage files — is unchanged, because an
# ApplicationSet already addresses a cluster by the name Argo CD knows it by,
# and that name is the agent's name.
#
# The label is what keeps the two halves apart. The hub runs a full Argo CD (it
# is a deployment target too: hello's staging stage and db-hello both run
# there), so the principal and every agent only look at objects carrying this
# label, and the hub's own application-controller keeps everything else. An
# Application for a spoke MUST have it or it is never routed; an Application for
# the hub must NOT, or two controllers reconcile it.
#
# Both values are set by Terraform from the hub's outputs (OneK8s'
# gitops/root-app.tf). enabled is false for a hub applied with
# enable_argocd_agent = false, and then nothing here is labelled — which is
# correct, because such a hub has no agents.
agent:
  enabled: false
  label: onek8s.io/agent-managed

# -----------------------------------------------------------------------------
# Kargo: the promotion engine in front of Argo CD.
#
# Argo CD answers "is the cluster what Git says it is" and has no opinion about
# which revision belongs on which cluster. Kargo answers that second question
# and writes the answer down: a Warehouse watches an application's image and
# chart and freezes each new build as a piece of Freight; a Stage carries one
# piece of Freight; and promoting a Stage is a commit under "stages/" in this
# repository, which Argo CD then syncs like any other commit.
#
# That is why no Application here is left un-automated. The gate in front of
# production is not "Argo CD has been told not to apply this" — it is "no commit
# says production runs that build yet", which cannot be undone by adding a sync
# policy back, is visible in `git log`, and names the person who opened it.
#
# enabled is set by Terraform from the hub's outputs: false when the hub was
# applied with enable_kargo = false, and then this chart renders no Kargo
# objects at all rather than a release path nothing reconciles.
kargo:
  enabled: true

  # Namespace the Kargo controller runs in on the hub. Informational here — the
  # objects below live in each application's own Project namespace.
  namespace: kargo

  # Base URL of the Kargo UI, for the deep link on each Stage. Empty when the
  # hub runs Kargo controller-only (no app registration configured yet).
  url: ""

  # One Kargo Project per application, named "<projectPrefix>-<app>", with a
  # namespace of the same name. Per application rather than one for the
  # platform, because a Project is Kargo's unit of isolation: its own Stages
  # (whose names would otherwise collide between applications), its own
  # Freight, its own promoters, its own namespace to hold a credential in. The
  # thing that must NOT be per application — how a promotion is performed — is
  # the single ClusterPromotionTask below.
  projectPrefix: onek8s

  # The one definition of how this platform promotes anything: a cluster-scoped
  # PromotionTask that every Stage of every application references. Fifty
  # applications share one copy of "clone, write the tag, commit, push, sync",
  # so a fix to the promotion procedure is one commit rather than fifty.
  promotionTask: onek8s-promote

  # Where promotions are written, relative to the root of this repository:
  # "<stagesPath>/<app>/<stage>.yaml". Those files are the ones Argo CD reads
  # back — see templates/applicationsets.yaml.
  stagesPath: stages

  # Authorship of the commits Kargo makes. It is a bot, and the history should
  # say so plainly rather than borrow a person's name.
  author:
    name: kargo
    email: kargo@onek8s.lol

  # Platform-wide default for who may promote to a stage that is not
  # auto-promoted, as Entra ID group object IDs (the "groups" claim Kargo's
  # OIDC config requests). An application overrides it with its own
  # apps.<name>.promoters, which is the normal case once a platform has more
  # than one team: the guest list belongs to the application, not to the
  # platform.
  #
  # Empty means only Kargo's own admins can promote — safe, but not useful.
  promoters: []

  # A GitHub webhook that tells Kargo to re-check the repositories at once
  # instead of on a Warehouse's polling interval. Each Project gets a receiver,
  # and each needs a shared secret, which is not configuration and is not
  # committed: create the Secret in the Project's namespace out of band and name
  # it here (see the README).
  webhook:
    enabled: false
    secretName: kargo-github-webhook

# -----------------------------------------------------------------------------
# The applications, and where each one is deployed.
#
# Every key is one application. The templates range over this map, so the
# framework's cost of a new application is an entry here:
#
#   chartPath   where its chart is, in the applications repository
#   repoURL     which applications repository, when it is not appsRepoURL
#   requires    dotted paths into these values that must be non-empty for the
#               application to be rendered at all — how db-hello follows its
#               database instead of a switch of its own
#   parameters  Helm parameters that are this application's business. Rendered
#               as templates with .cloud, .stage, .app and .Values in scope, so
#               a value that differs per cloud is resolved here rather than
#               branched on inside a chart. cloud, environment, tenant and
#               ingress.host are passed to every application and need no entry.
#   release     the artifacts a promotion carries. An application WITH this
#               block gets a Kargo Project, a Warehouse and one Stage object
#               per stage. One WITHOUT it is deployed straight from
#               appsTargetRevision — right for an application with a single
#               cluster, which has no release *path* to travel.
#   stages      one entry per cluster this application is deployed to, in order
#
# A stage names either a "cluster" (a fixed cluster Argo CD already knows, used
# for the hub, which has no labelled cluster Secret to select on) or only a
# "cloud" (matched by label against the spokes the gitops stack registered for
# this environment — so a cloud that is not a spoke here produces no
# Application).
#
# Two fields make the gate:
#
#   autoPromotion  false means Kargo creates no Promotion by itself. The
#                  Freight becomes *available* to the stage and waits for a
#                  person, in the UI, with `kargo promote`, or as a Promotion
#                  object.
#   promotedFrom   the stage this one draws Freight from. Production may only
#                  take what staging has already run, so an untested build
#                  cannot be promoted straight to AWS even by somebody who is
#                  allowed to promote.
apps:
  hello:
    enabled: true
    chartPath: apps/hello/chart
    # Host label: "<cloud>-hello.<domain>".
    hostPrefix: hello

    parameters:
      # The tenant secret the application displays, and the key each cloud's
      # backend actually spells it with. This is the only string on the
      # platform that is not the same word on every cloud, and resolving it
      # here is deliberate: Key Vault names are flat because each environment
      # has its own vault, while Secrets Manager is account-wide, so the
      # tenant's IAM role there is restricted to "<environment>/<tenant>/*"
      # (modules/tenant-namespace/aws/main.tf in the OneK8s repository).
      #
      # The chart is handed the finished key and never learns which cloud it
      # landed on — a developer's chart has no business branching on that.
      #
      # "test" must match TEST_SECRET in OneK8s'
      # .github/workflows/renew-certificate.yml, which writes the value into
      # every backend.
      secret.name: test
      secret.remoteKey: >-
        {{ if eq .cloud "aws" }}{{ .Values.environment }}/{{ .Values.tenant }}/test{{ else }}{{ .Values.tenant }}-test{{ end }}
      welcomeMessage: Welcome to OneK8s on {{ .cloud }} ({{ .Values.environment }}, {{ .stage }})!

    release:
      image:
        repository: ghcr.io/olljanat-ai/onek8s-hello/hello
        # How Kargo decides which tag is "newest".
        #
        #   NewestBuild  reads each candidate's build timestamp. Right for
        #                content-addressed tags ("sha-<short>"), which have no
        #                order of their own — this application builds on every
        #                merge and has no releases to speak of.
        #   SemVer       compares versions, and is what an application with
        #                real releases should use: set semverConstraint per
        #                environment ("^1.0.0", or "1.x-0" to include
        #                pre-releases in a lower stage) and the tag becomes
        #                readable in the promotion history.
        #
        # The build workflow in OneK8s-hello publishes a semver tag as well
        # whenever a "v*" git tag is pushed, so switching an application over is
        # this field plus a constraint.
        selectionStrategy: NewestBuild
        # Immutable build tags only. No moving "latest" is published, which is
        # what makes "the tag in Git" and "the image running" the same
        # statement. Empty allows every tag.
        tagRegexes:
          - ^sha-[0-9a-f]{7,40}$
        # Only read with selectionStrategy: SemVer.
        semverConstraint: ""
        strictSemvers: true
        # How many tags Kargo considers per discovery run. NewestBuild reads
        # each candidate's creation time, so this is a real cost rather than a
        # formality.
        discoveryLimit: 20

      # How often the Warehouse looks for a new build or a chart change. The
      # webhook above makes this a backstop rather than the normal path.
      interval: 5m

      # Which paths in the applications repository produce new Freight when
      # they change. Defaults to the chart path: a commit that only touches the
      # application's source produces a new image and no new chart revision,
      # and a documentation change produces neither.
      #
      # Subscribing to the chart at all is what makes the gate cover the
      # manifests as well as the code — with only the image watched, a chart
      # change would reach every stage the moment it merged.
      chartPaths: []

    # Who may promote to this application's gated stages. Empty falls back to
    # kargo.promoters.
    promoters: []

    #   staging     Azure (AKS, the hub)   auto-promoted: every new build lands
    #   production  AWS   (EKS, a spoke)   promoted by a human, from staging
    stages:
      staging:
        cloud: azure
        # The hub is not a spoke: Argo CD addresses the cluster it runs on as
        # "in-cluster" and it carries no cluster Secret, so it is named rather
        # than selected.
        cluster: in-cluster
        # Empty promotedFrom means the Warehouse itself: staging is where new
        # Freight enters the release path.
        promotedFrom: ""
        autoPromotion: true
      production:
        # Selected by label: the AWS spoke's cluster Secret is written and
        # labelled by the gitops stack in the OneK8s repository.
        cloud: aws
        promotedFrom: staging
        autoPromotion: false
        # Optional: how long a piece of Freight must have been running in the
        # stage it comes from before it can be promoted on. Empty means no
        # soak, which is right for a lab; "2h" would mean production can only
        # take a build staging has survived for two hours.
        soakTime: ""

  # The Azure-only example: a database application authenticating with the
  # tenant's managed identity. One cluster, so no "release" block and no Kargo
  # objects — an application with one stage has no release *path*, and a
  # Warehouse in front of it would be ceremony rather than a gate. It tracks
  # appsTargetRevision directly.
  db-hello:
    enabled: true
    chartPath: apps/db-hello/chart
    hostPrefix: db-hello
    # Its database is an Azure resource and its identity is an Entra one, so
    # the application follows the database rather than a switch of its own:
    # with enable_sql = false in the Azure foundation, OneK8s' root-app.tf
    # passes an empty sql.server and nothing here is rendered.
    requires:
      - sql.server
      - sql.database
    parameters:
      sql.server: "{{ .Values.sql.server }}"
      sql.database: "{{ .Values.sql.database }}"
      welcomeMessage: Welcome to OneK8s on {{ .cloud }} ({{ .Values.environment }}), with a database!
    stages:
      # Named for the cloud rather than for a stage, because that is what it is:
      # the one place this application runs.
      azure:
        cloud: azure
        cluster: in-cluster
